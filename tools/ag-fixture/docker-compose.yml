# Two-node clusterless (read-scale) Availability Group fixture.
#
# Both nodes are SQL Server 2022 with HADR enabled. `hostname` is pinned so that
# @@SERVERNAME inside each container is `ag1` / `ag2`, which is what the AG replica
# names and the tcp://ag1:5022 endpoint URLs resolve against on the compose network.
#
# Start with setup.ps1, not `docker compose up` on its own - the AG itself is built
# by the numbered scripts in sql/.
#
# DELIBERATELY SMALL. This fixture is sized to coexist with a busy VM fleet on the
# same machine, not to perform. Two SQL Server instances at 1 CPU and 2 GB each is
# the floor that still runs a synchronous-commit AG: SQL Server on Linux refuses to
# start below ~2000 MB, so mem_limit cannot go under 2g, and MSSQL_MEMORY_LIMIT_MB
# holds the engine itself to 1536 MB inside that. See README "Resource footprint".
#
# No MSSQL_AGENT_ENABLED: the AG needs no Agent jobs, and the Agent is one more
# resident process per container.
name: ag-fixture

services:
  ag1:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ag1
    hostname: ag1
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in tools/ag-fixture/.env - copy .env.example}
      MSSQL_PID: Developer
      MSSQL_ENABLE_HADR: "1"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "14331:1433"
    volumes:
      - ag1-data:/var/opt/mssql
    networks:
      - ag
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  ag2:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ag2
    hostname: ag2
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in tools/ag-fixture/.env - copy .env.example}
      MSSQL_PID: Developer
      MSSQL_ENABLE_HADR: "1"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "14332:1433"
    volumes:
      - ag2-data:/var/opt/mssql
    networks:
      - ag
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

networks:
  ag:
    name: ag-fixture-net

volumes:
  ag1-data:
  ag2-data:
